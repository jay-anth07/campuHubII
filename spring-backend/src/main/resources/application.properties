# Spring Boot 3 Server Configuration
server.port=8080
server.servlet.context-path=/

# PostgreSQL Relational Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/campushub_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=campushub-super-secret-key-that-must-be-at-least-256-bits-long
app.jwt.expiration-ms=86400000

# File Upload Multipart limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
